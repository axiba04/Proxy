# =========================================================
# 旁路由终极优化版 (配合 iKuai-bypass + PaoPao DNS + Nikki 纯内核)
# =========================================================

# ----------------- 机场订阅 -----------------
proxy-providers:
  Airport1:
    url: ""
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连

proxies:
  - {name: 直连, type: direct}

# ----------------- 全局配置 -----------------
mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true

# ----------------- 核心外部模块 -----------------
# NTP 时间同步 (极其重要：防止 OpenWrt 掉电/重启后时间错乱导致 SSL 证书失效、节点彻底阻断)
ntp:
  enable: true
  write-to-system: true
  server: ntp.aliyun.com
  port: 123
  interval: 30

# Geodata 数据库自动更新 (已剔除第三方镜像，直连官方原源保障稳定性)
#geodata-mode: true
#geodata-loader: standard
#geo-auto-update: true
#geo-update-interval: 24
#geox-url:
#  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.dat"
#  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"

# UI面板参数 (供需要时使用)
external-controller: 0.0.0.0:9090
secret: ""
external-ui: ui
external-ui-name: zashboard
external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# ----------------- 嗅探模块 -----------------
# redir-host 模式下非常依赖嗅探来匹配域名规则，请保持开启
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# ----------------- 入站 (TUN 模块) -----------------
tun:
  enable: true
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# ----------------- DNS 模块 -----------------
# 专为 redir-host + iKuai 国内IP白名单优化，彻底杜绝死锁
dns:
  enable: true
  cache-algorithm: arc
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: redir-host
  
  # 基础系统自举 DNS，必须为纯 IP
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 节点域名解析 DNS
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
  # 直连规则 DNS (国内高优先，保证国内 CDN 最佳调度)
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  # 代理规则 DNS (获取纯净真实海外 IP，防污染)
  nameserver:
    - https://8.8.8.8/dns-query
    - https://1.1.1.1/dns-query

# ----------------- 代理策略组 -----------------
proxy-groups:
